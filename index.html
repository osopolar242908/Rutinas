*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2A2536; --soft:#746C85; --faint:#A79FB5;
  --bg:#FBFAFD; --card:#FFFFFF;
  --line:#ECE8F2; --line2:#DCD6E6;
  --ok:#4C9E7A; --warn:#C9913F; --bad:#C96A72; --acento:#6B5CA5;
  --sh:0 1px 2px rgba(42,37,54,.04), 0 6px 20px rgba(42,37,54,.055);
  --sh-s:0 1px 2px rgba(42,37,54,.05);
}
[data-modo="oscuro"]{
  --ink:#F0ECF7; --soft:#A79FB8; --faint:#746C88;
  --bg:#141220; --card:#1D1A29;
  --line:#2A2638; --line2:#3A3450;
  --ok:#5FB98E; --warn:#D9A862; --bad:#E08177; --acento:#A596E0;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  --sh-s:0 1px 3px rgba(0,0,0,.26);
}
html{overflow-x:hidden}
body{font-family:'Cuerpo',system-ui,-apple-system,sans-serif;font-size:15.5px;line-height:1.45;
  color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 12% 0%, #F3EEFB 0, transparent 44%),
                   radial-gradient(circle at 88% 3%, #EAF3FB 0, transparent 38%);
  background-attachment:fixed;
  padding:max(16px, env(safe-area-inset-top)) 15px 104px;max-width:620px;margin:0 auto;
  min-height:100%}
[data-modo="oscuro"] body{background-image:radial-gradient(circle at 12% 0%, #221B33 0, transparent 44%),
  radial-gradient(circle at 88% 3%, #192334 0, transparent 38%)}

h1,h2,h3,.serif{font-family:'Serifa',Georgia,serif;font-weight:600;letter-spacing:-.012em}
h1{font-size:1.7rem;line-height:1.14}
h2{font-size:1.2rem}
h3{font-size:1rem}
.sub{font-family:'Serifa',Georgia,serif;font-weight:400;font-size:.95rem;color:var(--soft);
  margin-top:3px}
.et{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
  font-family:'Cuerpo',sans-serif;font-weight:500}
.chico{font-size:.84rem} .suave{color:var(--soft)} .tenue{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;gap:11px;margin-bottom:16px}
header .tit{flex:1;min-width:0}

.caja{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);
  padding:15px}
.caja + .caja{margin-top:12px}
.btn{font-family:'Cuerpo',sans-serif;font-weight:500;font-size:.95rem;color:var(--ink);
  cursor:pointer;background:var(--card);border:1px solid var(--line2);border-radius:12px;
  box-shadow:var(--sh-s);padding:10px 15px;transition:transform .1s,background .12s}
.btn:active{transform:scale(.97);background:var(--bg)}
.btn-ppal{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-chico{padding:7px 12px;font-size:.86rem}
.btn-ancho{width:100%;display:block;text-align:center}
.btn-peligro{color:var(--bad);border-color:#EFD9DC}
.btn-icono{width:38px;height:38px;padding:0;display:grid;place-items:center;flex:0 0 auto;
  border-radius:50%;color:var(--soft);background:transparent;border:1px solid var(--line)}
input,select,textarea{font-family:'Cuerpo',sans-serif;font-size:1rem;color:var(--ink);width:100%;
  background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;
  outline:none}
input:focus,select:focus{border-color:var(--acento)}
label.campo{display:block;margin:12px 0 5px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
  linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.ico{width:20px;height:20px;flex:0 0 auto}
.ico-g{width:26px;height:26px;flex:0 0 auto}
.ico-xl{width:52px;height:52px;flex:0 0 auto}

/* ---------- racha ---------- */
.racha{display:flex;align-items:center;gap:12px;padding:13px 15px}
.racha .n{font-family:'Serifa',Georgia,serif;font-weight:600;font-size:2rem;line-height:1}
.racha .txt{flex:1;min-width:0}

/* ---------- tarjeta de rutina ---------- */
.rut{border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden;
  margin-bottom:12px;background:var(--card)}
.rut-cab{display:flex;align-items:center;gap:12px;padding:14px 15px;cursor:pointer}
.rut-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  color:#2A2536}
.rut-cab .cuerpo{flex:1;min-width:0}
.rut-cab h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rut-cab .n2{font-size:.82rem;color:var(--soft)}
.rut-pie{display:flex;gap:9px;padding:0 15px 14px}
.rut-pie .btn{flex:1}
.pasos{padding:0 15px 8px}
.paso-min{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.9rem;
  border-top:1px solid var(--line)}
.paso-min .ico{color:var(--soft)}
.paso-min .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paso-min .m{color:var(--soft);font-size:.82rem}
.hecha{opacity:.62}
.sello{display:inline-flex;align-items:center;gap:4px;border:1px solid currentColor;
  border-radius:999px;padding:1px 9px;font-size:.72rem}
.sello.ok{color:var(--ok)}

/* ---------- selector de vista ---------- */
.vistas{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;
  margin-bottom:14px;background:var(--card)}
.vistas button{flex:1;background:transparent;border:none;border-right:1px solid var(--line2);
  padding:9px 4px;cursor:pointer;font-family:'Cuerpo',sans-serif;font-size:.84rem;
  color:var(--soft);display:flex;align-items:center;justify-content:center;gap:6px}
.vistas button:last-child{border-right:none}
.vistas button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vistas .ico{width:16px;height:16px}

/* ---------- calendario ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:.7rem;color:var(--faint);padding:4px 0;
  text-transform:uppercase;letter-spacing:.06em}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.84rem;
  cursor:pointer;background:var(--card)}
.cal .d.fuera{opacity:.3;border-color:transparent;background:transparent}
.cal .d.hoy{border-color:var(--ink);border-width:1.5px}
.cal .d .puntos{display:flex;gap:2px}
.cal .d i{width:5px;height:5px;border-radius:50%;background:var(--line2);display:block}
.cal .d i.ok{background:var(--ok)}
.leyenda-cal{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:.78rem;
  color:var(--soft)}
.leyenda-cal span{display:flex;align-items:center;gap:5px}
.leyenda-cal i{width:7px;height:7px;border-radius:50%;display:block;background:var(--line2)}
.leyenda-cal i.ok{background:var(--ok)}

/* ---------- cronologica ---------- */
.crono{position:relative;padding-left:62px}
.crono::before{content:'';position:absolute;left:52px;top:6px;bottom:6px;width:1px;
  background:var(--line2)}

const ICO_NOMBRES = {despertar:'Despertar',ducha:'Ducha',diente:'Dientes',cafe:'Café',
  agua:'Agua',comer:'Comer',ejercicio:'Ejercicio',correr:'Correr',estirar:'Estirar',

function icono(k, clase){
  return '<svg class="' + (clase || 'ico') + '" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'
    + (ICO[k] || ICO.otros) + '</svg>';
}

/* ================== DATOS ================== */
const LLAVE = 'rutinas-v1';
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_LARGO = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
  'septiembre','octubre','noviembre','diciembre'];
const COLORES = ['#F6DCE6','#DCEFE4','#E4DEF8','#FBE7D2','#D9E8F7','#F7F0CE'];

let db = null;
let vista = {pantalla:'hoy', modo:'lista', mes:null, rutina:null};

function p2(n){ return String(n).padStart(2,'0'); }
function hoyISO(){ const d = new Date();
  return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }
function diaSemana(iso){ const [a,m,d] = iso.split('-').map(Number);
  return new Date(a, m-1, d).getDay(); }
function fechaLarga(iso){ const [a,m,d] = iso.split('-');
  return Number(d) + ' de ' + MESES[Number(m)-1]; }
function sumaDias(iso, n){
  const [a,m,d] = iso.split('-').map(Number);
  const f = new Date(a, m-1, d + n);
  return f.getFullYear() + '-' + p2(f.getMonth()+1) + '-' + p2(f.getDate());
}
function id(){ return Math.random().toString(36).slice(2,9); }
function num(v){ const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : 0; }
function esc(s){ return String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* minutos y segundos legibles */
function reloj(seg){
  const s = Math.max(0, Math.round(seg));
  return p2(Math.floor(s/60)) + ':' + p2(s%60);
}
function duracion(seg){
  const s = Math.max(0, Math.round(seg));
  if(s < 60) return s + ' s';
  const m = Math.round(s/60);
  if(m < 60) return m + ' min';
  const h = Math.floor(m/60), r = m%60;
  return h + ' h' + (r ? ' ' + r + ' min' : '');
}

function nuevaBase(){
  return {
    rutinas:[{
      id:id(), nombre:'Rutina de la mañana', ico:'sol', color:COLORES[3],
      dias:[1,2,3,4,5], hora:'07:00', activa:true,
      pasos:[
        {id:id(), nombre:'Tender la cama', ico:'cama', seg:180},
        {id:id(), nombre:'Ducha', ico:'ducha', seg:600},
        {id:id(), nombre:'Vestirse', ico:'ropa', seg:300},
        {id:id(), nombre:'Desayuno', ico:'cafe', seg:900}
      ]
    }],
    sesiones:[], tema:null
  };
}
function cargar(){
  try{
    const crudo = localStorage.getItem(LLAVE);
    db = crudo ? JSON.parse(crudo) : nuevaBase();
  }catch(e){ db = nuevaBase(); }
  if(!db.rutinas) db.rutinas = [];
  if(!db.sesiones) db.sesiones = [];
}
function guardar(){ try{ localStorage.setItem(LLAVE, JSON.stringify(db)); }catch(e){} }

/* ---------- consultas ---------- */
function rutina(i){ return db.rutinas.find(r => r.id === i); }
function duracionRutina(r){ return r.pasos.reduce((s,p) => s + num(p.seg), 0); }
function tocaHoy(r, iso){ return r.activa !== false && r.dias.includes(diaSemana(iso || hoyISO())); }
function rutinasDe(iso){
  return db.rutinas.filter(r => tocaHoy(r, iso))
    .sort((a,b) => (a.hora || '').localeCompare(b.hora || ''));
}
function sesionesDe(iso){ return db.sesiones.filter(s => s.fecha === iso); }
function hechaHoy(rid, iso){
  return db.sesiones.some(s => s.rutina === rid && s.fecha === (iso || hoyISO()) && s.completa);
}

/* ---------- racha ---------- */
/* dias seguidos en los que completaste al menos una rutina de las que tocaban */
function racha(){
  let n = 0;
  let f = hoyISO();
  /* si hoy todavia no has hecho nada, la racha se mide desde ayer */
  if(!sesionesDe(f).some(s => s.completa)) f = sumaDias(f, -1);
  for(let i = 0; i < 400; i++){
    const tocaban = db.rutinas.filter(r => tocaHoy(r, f));
    const hechas = sesionesDe(f).some(s => s.completa);
    if(hechas) n++;
    else if(tocaban.length) break;   /* tocaba y no la hizo: se corta */
    f = sumaDias(f, -1);
  }
  return n;
}
function rachaDe(rid){
  let n = 0;
  let f = hoyISO();
  if(!db.sesiones.some(s => s.rutina === rid && s.fecha === f && s.completa)) f = sumaDias(f, -1);
  const r = rutina(rid);
  for(let i = 0; i < 400; i++){
    const hecha = db.sesiones.some(s => s.rutina === rid && s.fecha === f && s.completa);
    if(hecha) n++;
    else if(r && tocaHoy(r, f)) break;
    f = sumaDias(f, -1);
  }
  return n;
}

/* ---------- historial por actividad ---------- */
/* cuanto tardas de verdad en un paso, segun las ultimas veces */
function historialPaso(rid, pid, limite){
  const r = [];
  db.sesiones.filter(s => s.rutina === rid).slice(-(limite || 8)).forEach(s => {
    const p = (s.pasos || []).find(x => x.id === pid);
    if(p) r.push(p);
  });
  return r;
}
function promedioReal(rid, pid){
  const h = historialPaso(rid, pid).filter(p => !p.saltado && p.real > 0);
  if(!h.length) return 0;
  return h.reduce((s,p) => s + p.real, 0) / h.length;
}
function vecesSaltado(rid, pid, de){
  const h = historialPaso(rid, pid, de || 3);
  return {saltos: h.filter(p => p.saltado).length, total: h.length};
}

/* ---------- sugerencias tras una sesion ---------- */
function sugerencias(ses){
  const r = rutina(ses.rutina);
  if(!r) return [];
  const out = [];
  (ses.pasos || []).forEach(p => {
    const paso = r.pasos.find(x => x.id === p.id);
    if(!paso) return;
    const prom = promedioReal(ses.rutina, p.id);
    const sal = vecesSaltado(ses.rutina, p.id, 3);

    if(sal.total >= 2 && sal.saltos >= 2){
      out.push({tipo:'quitar', pasoId:p.id, nombre:paso.nombre,
        texto:'Saltaste «' + paso.nombre + '» ' + sal.saltos + ' de las últimas '
          + sal.total + ' veces. ¿La quitamos de la rutina?'});
      return;
    }
    if(!p.saltado && prom > 0 && prom > num(paso.seg) * 1.25){
      const nuevo = Math.round(prom / 30) * 30;
      if(nuevo > num(paso.seg)){
        out.push({tipo:'subir', pasoId:p.id, nombre:paso.nombre, seg:nuevo,
          texto:'En «' + paso.nombre + '» sueles tardar ' + duracion(prom) + ', y le tienes '
            + duracion(paso.seg) + '. ¿Le subimos a ' + duracion(nuevo) + '?'});
      }
    }
    if(!p.saltado && prom > 0 && prom < num(paso.seg) * 0.6 && num(paso.seg) > 120){
      const nuevo = Math.max(60, Math.round(prom / 30) * 30);
      out.push({tipo:'bajar', pasoId:p.id, nombre:paso.nombre, seg:nuevo,
        texto:'«' + paso.nombre + '» te toma ' + duracion(prom) + ' y le tienes '
          + duracion(paso.seg) + '. ¿Le bajamos a ' + duracion(nuevo)
          + ' y aprovechas ese rato?'});
    }
  });
  return out.slice(0, 3);
}

/* ---------- copiar y respaldo ---------- */
function copiarTexto(txt){
  return new Promise(res => {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(() => res(true)).catch(() => res(viejoCopiar(txt)));
    } else res(viejoCopiar(txt));
  });
}
function viejoCopiar(txt){
  try{
    const a = document.createElement('textarea');
    a.value = txt; a.setAttribute('readonly','');
    a.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(a); a.focus(); a.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(a);
    return ok;
  }catch(e){ return false; }
}
function mostrarTexto(txt){
  abrir('<h2>Copia el texto</h2>'
    + '<p class="chico suave" style="margin:6px 0 10px">Tu navegador no deja copiar solo. '
    + 'Mantén presionado, selecciona todo y copia.</p>'
    + '<textarea id="x-texto" rows="9"></textarea>'
    + '<div class="acciones"><button class="btn btn-ppal btn-ancho" data-cerrar="1">Listo</button>'
    + '</div>');
  const c = document.getElementById('x-texto');
  if(c){ c.value = txt; c.focus(); c.select(); }
}
function nombreCopia(){ return 'mis-rutinas-' + hoyISO() + '.json'; }
function exportar(){
  const texto = JSON.stringify(db);
  try{
    const url = URL.createObjectURL(new Blob([texto], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = nombreCopia();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    abrir('<h2>Copia de tus rutinas</h2>'
      + '<p class="chico suave" style="margin-top:6px">Si tu navegador permitió la descarga, '
      + 'el archivo <b>' + nombreCopia() + '</b> está en tus Descargas.</p>'
      + '<p class="chico suave" style="margin-top:8px">Si no apareció nada, copia el texto '
      + 'con el botón de abajo.</p>'
      + '<div class="acciones"><button class="btn" data-copiar-copia="1">Copiar el texto</button>'
      + '<button class="btn btn-ppal" data-cerrar="1">Listo</button></div>');
  }catch(e){ mostrarTexto(texto); }
}
let copiaPendiente = null;
function aplicarCopia(texto){
  let d;
  try{ d = JSON.parse(texto); }catch(e){ d = null; }
  if(!d || !Array.isArray(d.rutinas)){
    abrir('<h2>No pude leer la copia</h2>'
      + '<p class="chico suave" style="margin-top:6px">El archivo no parece una copia de esta app.'
      + '</p><div class="acciones"><button class="btn btn-ppal btn-ancho" data-cerrar="1">'
      + 'Entendido</button></div>');
    return;
  }
  copiaPendiente = d;
  abrir('<h2>Restaurar la copia</h2>'
    + '<p class="chico suave" style="margin-top:6px">Tiene <b>' + d.rutinas.length
    + '</b> rutinas y <b>' + (d.sesiones || []).length + '</b> sesiones. '
    + 'Esto reemplaza lo que hay ahora.</p>'
    + '<div class="acciones"><button class="btn" data-cerrar="1">Cancelar</button>'
    + '<button class="btn btn-ppal" data-confirmar-copia="1">Restaurar</button></div>');
}

/* ---------- calendario del mes ---------- */
function vistaCalendario(){
  const m = vista.mes || hoyISO().slice(0,7);
  const [a, me] = m.split('-').map(Number);
  const primero = new Date(a, me-1, 1);
  const dias = new Date(a, me, 0).getDate();
  const desfase = primero.getDay();

  let h = '<div class="caja">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    + '<button class="btn-icono" data-mes="-1" aria-label="Mes anterior">‹</button>'
    + '<strong class="serif">' + MESES[me-1] + ' ' + a + '</strong>'
    + '<button class="btn-icono" data-mes="1" aria-label="Mes siguiente">›</button></div>'
    + '<div class="cal">'
    + DIAS.map(d => '<div class="dh">' + d[0] + '</div>').join('');

  for(let i = 0; i < desfase; i++) h += '<div class="d fuera"></div>';
  for(let d = 1; d <= dias; d++){
    const iso = a + '-' + p2(me) + '-' + p2(d);
    const tocan = db.rutinas.filter(r => tocaHoy(r, iso));
    const hechas = sesionesDe(iso).filter(s => s.completa);
    const puntos = tocan.slice(0,3).map((r,i) =>
      '<i class="' + (hechas.length > i ? 'ok' : '') + '"></i>').join('');
    h += '<div class="d' + (iso === hoyISO() ? ' hoy' : '') + '" data-dia="' + iso + '">'
      + '<span>' + d + '</span><span class="puntos">' + puntos + '</span></div>';
  }
  h += '</div><div class="leyenda-cal"><span><i></i>toca</span><span><i class="ok"></i>hecha</span>'
    + '</div></div>';

  if(vista.diaSel){
    const s = sesionesDe(vista.diaSel);
    h += '<div class="caja"><h3>' + fechaLarga(vista.diaSel) + '</h3>'
      + '<div class="div"></div>'
      + (db.rutinas.filter(r => tocaHoy(r, vista.diaSel)).map(r => {
          const hecha = s.some(x => x.rutina === r.id && x.completa);
          return '<div class="paso-min">' + icono(r.ico)
            + '<span class="t">' + esc(r.nombre) + '</span>'
            + '<span class="m">' + (hecha ? 'hecha' : 'no') + '</span></div>';
        }).join('') || '<p class="chico suave">Ese día no tocaba ninguna rutina.</p>')
      + '</div>';
  }
  return h;
}

/* ================== PANTALLA: HISTORIAL ================== */
function verHistorial(){
  let h = '<header><div class="tit"><h1>Historial</h1></div></header>';
  const ses = db.sesiones.slice().reverse().slice(0, 40);
  if(!ses.length){
    return h + '<div class="caja"><div class="vacio"><span class="et">Nada todavía</span>'
      + 'Cuando termines una rutina, aquí queda<br>el detalle de cuánto te tomó cada cosa.'
      + '</div></div>';
  }
  const total = db.sesiones.filter(s => s.completa).length;
  h += '<div class="caja racha">' + ui('historial','ico-g')
    + '<div class="txt"><div class="et">Rutinas completadas</div>'
    + '<div class="chico suave">desde que empezaste</div></div>'
    + '<span class="n">' + total + '</span></div>';

  h += '<div style="margin-top:12px">';
  ses.forEach(s => {
    const r = rutina(s.rutina);
    const real = (s.pasos || []).reduce((x,p) => x + num(p.real), 0);
    const asig = (s.pasos || []).reduce((x,p) => x + num(p.asignado), 0);
    const dif = real - asig;
    h += '<div class="caja" style="margin-top:9px;padding:12px 14px" data-ver-sesion="' + s.id + '">'
      + '<div style="display:flex;align-items:center;gap:11px">'
      + '<span class="rut-ico" style="background:' + ((r && r.color) || COLORES[0])
      + ';width:36px;height:36px;border-radius:11px">' + icono(r ? r.ico : 'check') + '</span>'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-weight:500">' + esc(r ? r.nombre : 'Rutina') + '</div>'
      + '<div class="chico suave">' + fechaLarga(s.fecha)
      + (s.completa ? '' : ' · sin terminar') + '</div></div>'
      + '<div style="text-align:right"><div class="num">' + duracion(real) + '</div>'
      + '<div class="chico ' + (dif > 60 ? 'suave' : 'suave') + '">'
      + (Math.abs(dif) < 60 ? 'en su tiempo'
         : dif > 0 ? duracion(Math.abs(dif)) + ' más' : duracion(Math.abs(dif)) + ' menos')
      + '</div></div></div></div>';
  });
  h += '</div>';
  return h;
}

/* ================== RUTINA EN MARCHA ================== */
let run = null;
let reloj_t = null;
let wake = null;

function iniciarRutina(rid){
  const r = rutina(rid);
  if(!r || !r.pasos.length) return;
  run = {
    rid: rid,
    pasos: r.pasos.map(p => ({id:p.id, nombre:p.nombre, ico:p.ico,
      asignado:num(p.seg), real:0, saltado:false})),
    idx: 0,
    restante: num(r.pasos[0].seg),
    pausado: false,
    ultimo: Date.now(),
    inicio: Date.now()
  };
  document.getElementById('correr').classList.add('on');
  document.body.style.overflow = 'hidden';
  pedirPantallaEncendida();
  pintarCorrer();
  reloj_t = setInterval(tic, 250);
}

async function pedirPantallaEncendida(){
  try{
    if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
  }catch(e){}
}
function soltarPantalla(){ try{ if(wake){ wake.release(); wake = null; } }catch(e){} }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && run && !run.pausado) pedirPantallaEncendida();
});

function tic(){
  if(!run) return;
  const ahora = Date.now();
  const d = (ahora - run.ultimo) / 1000;
  run.ultimo = ahora;
  if(run.pausado) return;
  const p = run.pasos[run.idx];
  if(!p) return;
  p.real += d;
  run.restante -= d;
  if(run.restante <= 0){ avisar(); avanzar(); return; }
  refrescarTiempo();
}

/* vibración y un pitido corto al cambiar de actividad */
function avisar(){
  try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 660; o.type = 'sine';
    g.gain.setValueAtTime(.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + .03);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .7);
    o.start(); o.stop(ctx.currentTime + .75);
    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 1100);
  }catch(e){}
}

function avanzar(){
  if(run.idx >= run.pasos.length - 1) return terminarRutina(true);
  run.idx++;
  run.restante = run.pasos[run.idx].asignado;
  pintarCorrer();
}
function saltarPaso(){
  if(!run) return;
  run.pasos[run.idx].saltado = true;
  if(run.idx >= run.pasos.length - 1) return terminarRutina(true);
  run.idx++;
  run.restante = run.pasos[run.idx].asignado;
  pintarCorrer();
}
function masTiempo(seg){
  if(!run) return;
  run.restante += seg;
  refrescarTiempo();
}
function pausar(){
  if(!run) return;
  run.pausado = !run.pausado;
  if(run.pausado) soltarPantalla(); else pedirPantallaEncendida();
  pintarCorrer();
}

/* ---------- pintar la pantalla de ejecución ---------- */
function pintarCorrer(){
  if(!run) return;
  const r = rutina(run.rid);
  const p = run.pasos[run.idx];
  const sig = run.pasos[run.idx + 1];
  const hechos = run.pasos.slice(0, run.idx).reduce((s,x) => s + x.asignado, 0);
  const totalPlan = run.pasos.reduce((s,x) => s + x.asignado, 0);
  const pct = totalPlan ? (hechos / totalPlan) * 100 : 0;

  document.getElementById('correr').innerHTML =
      '<div class="correr-cab">'
    + '<button class="btn-icono" data-salir-correr="1" aria-label="Salir">' + ui('cerrar') + '</button>'
    + '<div class="tit"><strong>' + esc(r ? r.nombre : '') + '</strong>'
    + '<div class="chico suave">Actividad ' + (run.idx + 1) + ' de ' + run.pasos.length + '</div></div>'
    + '<button class="btn-icono" data-reordenar="1" aria-label="Reorganizar">' + ui('mover') + '</button>'
    + '</div>'
    + '<div class="progreso-total"><i style="width:' + pct + '%"></i></div>'

    + '<div class="correr-centro">'
    + '<div class="anillo" id="anillo">'
    + '<svg viewBox="0 0 120 120"><circle class="pista" cx="60" cy="60" r="54"/>'
    + '<circle class="avance" id="avance" cx="60" cy="60" r="54" '
    + 'stroke-dasharray="339.3" stroke-dashoffset="0"/></svg>'
    + '<div class="dentro">' + icono(p.ico, 'ico-xl')
    + '<span class="tiempo" id="t-grande">' + reloj(run.restante) + '</span></div></div>'
    + '<h2>' + esc(p.nombre) + '</h2>'
    + '<div class="siguiente">' + (sig ? 'Luego: ' + esc(sig.nombre) : 'Es la última')
    + ' · asignado ' + duracion(p.asignado) + '</div>'
    + (run.pausado ? '<div class="pausa-aviso">En pausa</div>' : '')
    + '</div>'

    + '<div class="correr-botones">'
    + '<button class="btn" data-pausa="1">' + ui(run.pausado ? 'play' : 'pausa')
    + (run.pausado ? ' Seguir' : ' Pausa') + '</button>'
    + '<button class="btn" data-mas-tiempo="60">' + ui('mastiempo') + ' 1 min</button>'
    + '<button class="btn" data-saltar="1">' + ui('saltar') + ' Saltar</button>'
    + '<button class="btn btn-ppal" data-terminar="1">Terminar</button>'
    + '</div>';
  refrescarTiempo();
}

function refrescarTiempo(){
  if(!run) return;
  const t = document.getElementById('t-grande');
  const a = document.getElementById('avance');
  const an = document.getElementById('anillo');
  if(!t || !a) return;
  const p = run.pasos[run.idx];
  t.textContent = reloj(run.restante);
  const total = Math.max(1, p.asignado);
  const queda = Math.max(0, Math.min(1, run.restante / total));
  a.setAttribute('stroke-dashoffset', String(339.3 * (1 - queda)));
  if(an) an.classList.toggle('ultimo', run.restante <= 10);
}

/* ---------- reorganizar en marcha ---------- */
function modalReordenar(){
  if(!run) return;
  tmp.orden = run.pasos.map(p => p.id);
  pintarReordenar();
}
function pintarReordenar(){
  const nombres = {};
  run.pasos.forEach(p => { nombres[p.id] = p; });
  abrir('<h2>Reorganizar</h2>'
    + '<p class="chico suave" style="margin-top:4px">Mueve las actividades que faltan.</p>'
    + '<div style="margin-top:12px">'
    + tmp.orden.map((pid, i) => {
        const p = nombres[pid];
        const pasada = run.pasos.findIndex(x => x.id === pid) < run.idx;
        return '<div class="paso-ed"' + (pasada ? ' style="opacity:.45"' : '') + '>'
          + icono(p.ico) + '<span class="t">' + esc(p.nombre) + '</span>'
          + '<span class="m">' + duracion(p.asignado) + '</span>'
          + (pasada ? '' :
             '<button class="mover" data-sube="' + i + '" aria-label="Subir">▲</button>'
             + '<button class="mover" data-baja="' + i + '" aria-label="Bajar">▼</button>')
          + '</div>';
      }).join('')
    + '</div>'
    + '<div class="acciones"><button class="btn" data-cerrar="1">Cancelar</button></div>'
    + '<div class="acciones"><button class="btn" data-aplicar-orden="vez">Solo esta vez</button>'
    + '<button class="btn btn-ppal" data-aplicar-orden="siempre">Todo el tiempo</button></div>');
}
function aplicarOrden(alcance){
  if(!run || !tmp.orden) return;
  const mapa = {};
  run.pasos.forEach(p => { mapa[p.id] = p; });
  const actual = run.pasos[run.idx].id;
  run.pasos = tmp.orden.map(pid => mapa[pid]);
  run.idx = run.pasos.findIndex(p => p.id === actual);

  if(alcance === 'siempre'){
    const r = rutina(run.rid);
    if(r){
      const m2 = {};
      r.pasos.forEach(p => { m2[p.id] = p; });
      r.pasos = tmp.orden.map(pid => m2[pid]).filter(Boolean);
      guardar();
    }
  }
  cerrar(); pintarCorrer();
}

/* ---------- terminar ---------- */
function terminarRutina(completa){
  if(!run) return;
  clearInterval(reloj_t); reloj_t = null;
  soltarPantalla();
  const ses = {
    id: id(), rutina: run.rid, fecha: hoyISO(), completa: !!completa,
    pasos: run.pasos.map(p => ({id:p.id, nombre:p.nombre, asignado:p.asignado,
      real: Math.round(p.real), saltado: p.saltado}))
  };
  db.sesiones.push(ses);
  if(db.sesiones.length > 400) db.sesiones = db.sesiones.slice(-400);
  guardar();
  run = null;
  document.body.style.overflow = '';
  document.getElementById('correr').classList.remove('on');
  pintar();
  verInforme(ses);
}
function salirSinGuardar(){
  if(!run) return;
  if(run.pasos.some(p => p.real > 5)) return terminarRutina(false);
  clearInterval(reloj_t); reloj_t = null;
  soltarPantalla();
  run = null;
  document.body.style.overflow = '';
  document.getElementById('correr').classList.remove('on');
}

/* ================== INFORME ================== */
function verInforme(ses){
  const r = rutina(ses.rutina);
  const real = ses.pasos.reduce((s,p) => s + num(p.real), 0);
  const asig = ses.pasos.reduce((s,p) => s + num(p.asignado), 0);
  const dif = real - asig;
  const sug = sugerencias(ses);
  tmp.sesion = ses;

  let h = '<h2>' + (ses.completa ? '¡Rutina terminada!' : 'Rutina a medias') + '</h2>'
    + '<p class="chico suave" style="margin-top:4px">' + esc(r ? r.nombre : '') + ' · '
    + fechaLarga(ses.fecha) + '</p>'
    + '<div class="caja" style="margin-top:14px">'
    + '<div style="display:flex;gap:14px;text-align:center">'
    + '<div style="flex:1"><div class="et">Tomó</div>'
    + '<div class="serif" style="font-size:1.5rem">' + duracion(real) + '</div></div>'
    + '<div style="flex:1"><div class="et">Planeado</div>'
    + '<div class="serif" style="font-size:1.5rem">' + duracion(asig) + '</div></div>'
    + '<div style="flex:1"><div class="et">Diferencia</div>'
    + '<div class="serif" style="font-size:1.5rem" class="' + (dif > 0 ? 'bad' : 'ok') + '">'
    + (Math.abs(dif) < 30 ? 'justo' : (dif > 0 ? '+' : '−') + duracion(Math.abs(dif)))
    + '</div></div></div></div>';

  h += '<div class="caja" style="margin-top:12px">';
  ses.pasos.forEach(p => {
    const d = num(p.real) - num(p.asignado);
    h += '<div class="fila-inf">' + icono((r && (r.pasos.find(x => x.id === p.id) || {}).ico)
        || 'check')
      + '<div class="t"><div class="n1">' + esc(p.nombre) + '</div>'
      + (p.saltado ? '<div class="chico suave">saltada</div>' : '') + '</div>'
      + '<div class="cifras"><div class="num">' + (p.saltado ? '—' : duracion(p.real))
      + ' <span class="suave">/ ' + duracion(p.asignado) + '</span></div>'
      + (p.saltado ? '' : '<div class="dif ' + (d > 30 ? 'suave' : 'suave') + '">'
          + (Math.abs(d) < 30 ? 'en su tiempo'
             : d > 0 ? duracion(d) + ' más' : duracion(-d) + ' menos') + '</div>')
      + '</div></div>';
  });
  h += '</div>';

  if(sug.length){
    h += '<h3 style="margin-top:16px">Sugerencias</h3>';
    sug.forEach((s,i) => {
      h += '<div class="sug"><div class="chico">' + s.texto + '</div>'
        + '<div class="acciones">'
        + '<button class="btn btn-chico" data-sug-no="' + i + '">Así está bien</button>'
        + '<button class="btn btn-chico btn-ppal" data-sug-si="' + i + '">'
        + (s.tipo === 'quitar' ? 'Quitarla' : 'Ajustar') + '</button></div></div>';
    });
    tmp.sug = sug;
  }

  h += '<div class="acciones"><button class="btn btn-ppal btn-ancho" data-cerrar="1">Listo</button>'
    + '</div>';
  abrir(h);
}

function aplicarSugerencia(i){
  const s = (tmp.sug || [])[i];
  if(!s) return;
  const r = rutina(tmp.sesion.rutina);
  if(!r) return;
  if(s.tipo === 'quitar') r.pasos = r.pasos.filter(p => p.id !== s.pasoId);
  else {
    const p = r.pasos.find(x => x.id === s.pasoId);
    if(p) p.seg = s.seg;
  }
  guardar();
  tmp.sug = tmp.sug.filter((_,k) => k !== i);
  verInforme(tmp.sesion);
}

/* ================== PINTAR Y EVENTOS ================== */
function pintar(){
  const app = document.getElementById('app');
  const f = {hoy:verHoy, rutinas:verRutinas, historial:verHistorial}[vista.pantalla];
  app.innerHTML = f ? f() : '';
  pintarNav();
}
function temaActual(){
  if(db.tema === 'claro' || db.tema === 'oscuro') return db.tema;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
    ? 'oscuro' : 'claro';
}
function aplicarTema(){ document.documentElement.setAttribute('data-modo', temaActual()); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-ir],[data-modo],[data-mes],[data-dia],[data-ajustes],'
    + '[data-nueva-rutina],[data-editar-rutina],[data-guardar-rutina],[data-borrar-rutina],'
    + '[data-dia-sem],[data-ico],[data-color],[data-nuevo-paso],[data-editar-paso],'
    + '[data-guardar-paso],[data-sube-paso],[data-baja-paso],[data-quita-paso],[data-icopaso],'
    + '[data-volver-rutina],[data-iniciar],[data-salir-correr],[data-pausa],[data-mas-tiempo],'
    + '[data-saltar],[data-terminar],[data-reordenar],[data-sube],[data-baja],'
    + '[data-aplicar-orden],[data-sug-si],[data-sug-no],[data-ver-sesion],[data-tema],'
    + '[data-exportar],[data-importar],[data-confirmar-copia],[data-copiar-copia],[data-cerrar]');
  if(!b) return;
  const d = b.dataset;

  /* navegación */
  if(d.ir){ vista.pantalla = d.ir; window.scrollTo(0,0); return pintar(); }
  if(d.modo){ vista.modo = d.modo; vista.diaSel = null; return pintar(); }
  if(d.mes){
    const m = vista.mes || hoyISO().slice(0,7);
    let [a,me] = m.split('-').map(Number);
    me += Number(d.mes);
    if(me > 12){ me = 1; a++; } if(me < 1){ me = 12; a--; }
    vista.mes = a + '-' + p2(me);
    return pintar();
  }
  if(d.dia){ vista.diaSel = (vista.diaSel === d.dia) ? null : d.dia; return pintar(); }
  if(d.cerrar) return cerrar();
  if(d.ajustes) return modalAjustes();

  /* rutinas */
  if(d.nuevaRutina) return modalRutina(null);
  if(d.editarRutina){ const r = rutina(d.editarRutina); if(r) modalRutina(r); return; }
  if(d.diaSem){
    const n = Number(d.diaSem);
    tmp.dias = tmp.dias.includes(n) ? tmp.dias.filter(x => x !== n) : tmp.dias.concat([n]);
    b.setAttribute('aria-pressed', tmp.dias.includes(n));
    return;
  }
  if(d.ico){ tmp.ico = d.ico;
    document.querySelectorAll('[data-ico]').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.ico === d.ico)); return; }
  if(d.color){ tmp.color = d.color;
    document.querySelectorAll('[data-color]').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.color === d.color)); return; }
  if(d.guardarRutina){
    const nom = document.getElementById('r-nom').value.trim() || 'Rutina';
    const hora = document.getElementById('r-hora').value || '';
    const datos = {nombre:nom, hora, dias:tmp.dias.slice().sort(), ico:tmp.ico,
      color:tmp.color, pasos:tmp.pasos, activa:true};
    if(tmp.rutina) Object.assign(tmp.rutina, datos);
    else db.rutinas.push({id:id(), ...datos});
    guardar(); cerrar(); return pintar();
  }
  if(d.borrarRutina){
    if(!b.dataset.seguro){ b.dataset.seguro = '1';
      b.textContent = 'Toca otra vez para confirmar'; return; }
    db.rutinas = db.rutinas.filter(r => r.id !== d.borrarRutina);
    guardar(); cerrar(); return pintar();
  }

  /* actividades dentro de la rutina */
  if(d.nuevoPaso) return modalPaso(null);
  if(d.editarPaso) return modalPaso(Number(d.editarPaso));
  if(d.icopaso){ tmp.icoPaso = d.icopaso;
    document.querySelectorAll('[data-icopaso]').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.icopaso === d.icopaso)); return; }
  if(d.volverRutina) return pintarModalRutina();
  if(d.guardarPaso){
    const nom = document.getElementById('p-nom').value.trim() || 'Actividad';
    const seg = Math.max(10, Math.round(num(document.getElementById('p-min').value) * 60)) || 300;
    if(tmp.pasoIdx >= 0) Object.assign(tmp.pasos[tmp.pasoIdx],
      {nombre:nom, seg, ico:tmp.icoPaso});
    else tmp.pasos.push({id:id(), nombre:nom, seg, ico:tmp.icoPaso});
    return pintarModalRutina();
  }
  if(d.subePaso){ const i = Number(d.subePaso);
    if(i > 0){ const x = tmp.pasos[i]; tmp.pasos[i] = tmp.pasos[i-1]; tmp.pasos[i-1] = x; }
    return pintarModalRutina(); }
  if(d.bajaPaso){ const i = Number(d.bajaPaso);
    if(i < tmp.pasos.length-1){ const x = tmp.pasos[i]; tmp.pasos[i] = tmp.pasos[i+1];
      tmp.pasos[i+1] = x; }
    return pintarModalRutina(); }
  if(d.quitaPaso){ tmp.pasos.splice(Number(d.quitaPaso), 1); return pintarModalRutina(); }

  /* ejecución */
  if(d.iniciar) return iniciarRutina(d.iniciar);
  if(d.salirCorrer) return salirSinGuardar();
  if(d.pausa) return pausar();
  if(d.masTiempo) return masTiempo(Number(d.masTiempo));
  if(d.saltar) return saltarPaso();
  if(d.terminar) return terminarRutina(true);
  if(d.reordenar) return modalReordenar();
  if(d.sube){ const i = Number(d.sube);
    if(i > 0){ const x = tmp.orden[i]; tmp.orden[i] = tmp.orden[i-1]; tmp.orden[i-1] = x; }
    return pintarReordenar(); }
  if(d.baja){ const i = Number(d.baja);
    if(i < tmp.orden.length-1){ const x = tmp.orden[i]; tmp.orden[i] = tmp.orden[i+1];
      tmp.orden[i+1] = x; }
    return pintarReordenar(); }
  if(d.aplicarOrden) return aplicarOrden(d.aplicarOrden);

  /* informe */
  if(d.sugSi) return aplicarSugerencia(Number(d.sugSi));
  if(d.sugNo){ tmp.sug = tmp.sug.filter((_,k) => k !== Number(d.sugNo));
    return verInforme(tmp.sesion); }
  if(d.verSesion){ const s = db.sesiones.find(x => x.id === d.verSesion);
    if(s) verInforme(s); return; }

  /* ajustes */
  if(d.tema){ db.tema = d.tema === 'auto' ? null : d.tema; aplicarTema(); guardar();
    document.querySelectorAll('[data-tema]').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.tema === (db.tema || 'auto')));
    return pintar(); }
  if(d.exportar) return exportar();
  if(d.importar){ const f = document.getElementById('archivo-copia'); if(f) f.click(); return; }
  if(d.copiarCopia){
    const txt = JSON.stringify(db);
    copiarTexto(txt).then(ok => { if(!ok) mostrarTexto(txt); else b.textContent = '¡Copiado!'; });
    return;
  }
  if(d.confirmarCopia){
    if(copiaPendiente){
      db = copiaPendiente; copiaPendiente = null;
      if(!db.rutinas) db.rutinas = []; if(!db.sesiones) db.sesiones = [];
      guardar(); aplicarTema(); cerrar(); window.scrollTo(0,0); return pintar();
    }
    return cerrar();
  }
});

document.getElementById('velo').addEventListener('click', () => { if(!run) cerrar(); });

document.addEventListener('change', e => {
  if(e.target.id !== 'archivo-copia') return;
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => aplicarCopia(String(r.result));
  r.onerror = () => aplicarCopia('');
  r.readAsText(f);
  e.target.value = '';
});
